[tool.poetry]
name = "compass-platform"
version = "0.1.0"
description = "RAG pipeline with FastAPI, AWS Bedrock, and OpenSearch Serverless"
authors = []
packages = [{ include = "compass" }]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.35"
opensearch-py = "^2.4"
requests-aws4auth = "^1.3"
fastapi = "^0.115"
uvicorn = { version = "^0.34", extras = ["standard"] }
pydantic-settings = "^2.0"
python-multipart = "^0.0.20"
beautifulsoup4 = "^4.14.3"
langchain-text-splitters = "^1.1.0"
lxml = "^6.0.2"
PyJWT = "^2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.9"

# Only installed into the AgentCore runtime image (Dockerfile.agent), not the
# FastAPI service image. The service talks to the runtime via boto3's
# bedrock-agentcore client, so it needs neither the Strands framework nor the
# AgentCore runtime SDK.
[tool.poetry.group.agent]
optional = true

[tool.poetry.group.agent.dependencies]
strands-agents = "^1.43"
bedrock-agentcore = "^1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
